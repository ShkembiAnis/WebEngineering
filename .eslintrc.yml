env:
  browser: true
  es2021: true
  node: true

extends:
  - standard-with-typescript
  - plugin:@typescript-eslint/recommended
  - plugin:prettier/recommended
  - prettier

parser: '@typescript-eslint/parser'
parserOptions:
  ecmaVersion: 'latest'
  sourceType: module
  project: './tsconfig.json'

plugins:
  - '@typescript-eslint'
  - prettier

rules:
  prettier/prettier: 'error'
