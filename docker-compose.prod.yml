services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_NGINX_PORT:-8081}"

  frontend:
    build:
      context: ./frontend
      target: nginx
    ports:
      - "${FRONTEND_NGINX_PORT:-8081}:80"
    depends_on:
      - backend


